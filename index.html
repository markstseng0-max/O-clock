<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<title>待機畫面</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  html, body { position: fixed; inset: 0; width: 100%; touch-action: none; overscroll-behavior: none; }
  * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #touch { position: fixed; top: -10vh; left: -10vw; width: 120vw; height: 120vh; z-index: 99; background: transparent; touch-action: none; }
  .page { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; will-change: transform, opacity; }
  /* 字型排印:等高數字 + 每個數字固定寬度(真正的等寬),分鐘跳動時不會晃 */
  .t { display: flex; flex-direction: row; align-items: center; color: #8e8e93; font-size: 30vw; line-height: 1; white-space: nowrap; text-rendering: geometricPrecision; font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum", "tnum"; font-kerning: none; }
  .hm { display: flex; flex: none; }
  .d { display: block; flex: none; width: var(--dw, 0.6em); text-align: center; letter-spacing: 0; }
  .gap { flex: none; width: 0.14em; height: 0; }
  @media (orientation: landscape) {
    .t { line-height: 0.85; }
    .gap { width: 0.09em; }
  }
  @media (orientation: portrait) {
    .t { flex-direction: column; line-height: 0.9; }
    .gap { width: 0; height: 0.04em; }
  }
  /* 1 原本款 */
  .f0 { font-family: "Permanent Marker", "Marker Felt", sans-serif; font-weight: 400; font-style: normal; -webkit-text-stroke: 0.025em #8e8e93; }
  /* 2 粗斜款:SF Pro 特粗斜體 */
  .f1 { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-weight: 800; font-style: italic; letter-spacing: -0.03em; }
  /* 3 條紋款:像 iPhone 鎖定畫面的切線字 */
  .f2 { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-weight: 800; font-style: normal; letter-spacing: -0.02em;
        background: repeating-linear-gradient(to bottom, #8e8e93 0, #8e8e93 0.047em, transparent 0.047em, transparent 0.058em);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  /* 4 細線款:像 iPhone 鎖定畫面的雙線細字 */
  .f3 { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; font-weight: 800; font-style: normal; letter-spacing: -0.02em; filter: url(#dbl); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="dbl" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feMorphology id="m1" in="SourceAlpha" operator="erode" radius="2" result="a1"/>
      <feComposite in="SourceAlpha" in2="a1" operator="out" result="ring1"/>
      <feMorphology id="m2" in="SourceAlpha" operator="erode" radius="4" result="a2"/>
      <feMorphology id="m3" in="SourceAlpha" operator="erode" radius="6" result="a3"/>
      <feComposite in="a2" in2="a3" operator="out" result="ring2"/>
      <feMerge result="rings"><feMergeNode in="ring1"/><feMergeNode in="ring2"/></feMerge>
      <feFlood flood-color="#8e8e93" result="c"/>
      <feComposite in="c" in2="rings" operator="in"/>
    </filter>
  </svg>
  <div id="stage">
    <div class="page" id="pA"><div class="t f0"><span class="hm"><span class="d">0</span><span class="d">0</span></span><span class="gap"></span><span class="hm"><span class="d">0</span><span class="d">0</span></span></div></div>
    <div class="page" id="pB" style="transform:translateY(100%)"><div class="t f0"><span class="hm"><span class="d">0</span><span class="d">0</span></span><span class="gap"></span><span class="hm"><span class="d">0</span><span class="d">0</span></span></div></div>
  </div>
  <div id="touch"></div>
<script>
  var pages = [document.getElementById("pA"), document.getElementById("pB")];
  var front = 0, cur = 0, busy = false;
  try { cur = parseInt(localStorage.getItem("clockFont") || "0", 10) || 0; } catch (e) {}
  cur = ((cur % 4) + 4) % 4;

  function cells(str) {
    return str.split("").map(function (c) { return '<span class="d">' + c + "</span>"; }).join("");
  }
  function timeText() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
    return '<span class="hm">' + cells(hh) + '</span><span class="gap"></span><span class="hm">' + cells(mm) + "</span>";
  }
  function tick() {
    var s = timeText();
    pages.forEach(function (p) { p.firstChild.innerHTML = s; });
  }
  // 量出這個字體 0~9 裡最寬的數字,每個數字都用同樣寬度的格子
  var meas = null;
  function setDigitWidth(el) {
    if (!meas) {
      meas = document.createElement("span");
      meas.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-size:100px;";
      document.body.appendChild(meas);
    }
    meas.className = el.className;
    var max = 0;
    for (var n = 0; n < 10; n++) {
      meas.textContent = String(n);
      var w = meas.getBoundingClientRect().width;
      if (w > max) max = w;
    }
    var land = (document.documentElement.clientWidth || window.innerWidth) > (document.documentElement.clientHeight || window.innerHeight);
    el.style.setProperty("--dw", (max / 100 * (land ? 0.95 : 1)) + "em");
  }
  function fit(el) {
    el.style.transform = "none";
    setDigitWidth(el);
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    var size = 100;
    el.style.fontSize = size + "px";
    for (var i = 0; i < 6; i++) {
      var r = el.getBoundingClientRect();
      var k = Math.min(vw * 0.94 / r.width, vh * 0.9 / r.height);
      size = size * k;
      el.style.fontSize = size + "px";
      if (Math.abs(k - 1) < 0.01) break;
    }
    // 細線款:線的粗細跟著字的大小
    if (el.classList.contains("f3")) {
      var r = Math.max(1, size * 0.014);
      document.getElementById("m1").setAttribute("radius", r);
      document.getElementById("m2").setAttribute("radius", r * 2);
      document.getElementById("m3").setAttribute("radius", r * 3);
    }
    // 橫屏時數字會顯得扁:在高度還有空間時,把數字往上下拉高一點
    if (vw > vh) {
      var rr = el.getBoundingClientRect();
      var sy = Math.max(1, Math.min(1.3, vh * 0.92 / rr.height));
      el.style.transform = "scaleY(" + sy + ")";
    }
  }
  function fitAll() { pages.forEach(function (p) { fit(p.firstChild); }); }

  function H() { return document.documentElement.clientHeight || window.innerHeight; }
  function place(out, inn, dir, p) {
    out.style.transform = "translateY(" + (-dir * p * H()) + "px)";
    out.style.opacity = String(1 - p);
    inn.style.transform = "translateY(" + (dir * (1 - p) * H()) + "px)";
  }
  function setTrans(on) {
    var v = on ? "transform 0.45s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.45s ease" : "none";
    pages.forEach(function (p) { p.style.transition = v; });
  }

  // 拖曳:手指拖多少,畫面就跟著動;往上滑是下一個,往下滑是上一個
  var dragging = false, startY = 0, lastY = 0, lastT = 0, vel = 0, dir = 0, prog = 0;
  function begin(d) {
    dir = d;
    var inn = pages[1 - front];
    inn.firstChild.className = "t f" + (((cur + d) % 4) + 4) % 4;
    tick();
    fit(inn.firstChild);
    setTrans(false);
    prog = 0;
    place(pages[front], inn, dir, 0);
  }
  function finish(go) {
    busy = true;
    var out = pages[front], inn = pages[1 - front];
    setTrans(true);
    place(out, inn, dir, go ? 1 : 0);
    setTimeout(function () {
      setTrans(false);
      if (go) {
        cur = (((cur + dir) % 4) + 4) % 4;
        try { localStorage.setItem("clockFont", String(cur)); } catch (e) {}
        front = 1 - front;
        out.style.transform = "translateY(100%)";
        out.style.opacity = "1";
      } else {
        inn.style.transform = "translateY(100%)";
      }
      dir = 0; prog = 0; busy = false;
    }, 470);
  }

  var tz = document.getElementById("touch");
  tz.addEventListener("touchstart", function (e) {
    if (busy) return;
    dragging = true; dir = 0; prog = 0;
    startY = lastY = e.touches[0].clientY;
    lastT = Date.now(); vel = 0;
  }, { passive: true });

  tz.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (!dragging) return;
    var y = e.touches[0].clientY;
    var dy = y - startY;
    var now = Date.now();
    if (now > lastT) vel = (y - lastY) / (now - lastT);
    lastY = y; lastT = now;
    if (dir === 0) {
      if (Math.abs(dy) < 6) return;
      begin(dy < 0 ? 1 : -1);
    }
    prog = Math.max(0, Math.min(1, (-dir * dy) / H()));
    place(pages[front], pages[1 - front], dir, prog);
  }, { passive: false });

  function end() {
    if (!dragging) return;
    dragging = false;
    if (dir === 0) return;
    var fast = (-dir * vel) > 0.5;
    finish(prog > 0.3 || (fast && prog > 0.02));
  }
  tz.addEventListener("touchend", end, { passive: true });
  tz.addEventListener("touchcancel", end, { passive: true });

  tick();
  pages[front].firstChild.className = "t f" + cur;
  pages[1 - front].style.transform = "translateY(100%)";
  fit(pages[front].firstChild);
  setInterval(tick, 1000);
  window.addEventListener("resize", fitAll);
  window.addEventListener("orientationchange", function () { setTimeout(fitAll, 300); });
  setTimeout(fitAll, 400);
  setTimeout(fitAll, 1500);
  if (document.fonts && document.fonts.load) { document.fonts.load('100px "Permanent Marker"').then(fitAll); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  ["gesturestart", "gesturechange", "gestureend", "contextmenu", "selectstart", "dblclick"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
</script>
</body>
</html>
