<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<title>待機畫面</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #time { font-family: "Permanent Marker", "Marker Felt", "Chalkboard SE", Impact, sans-serif; color: #8e8e93; font-size: 30vw; font-weight: 900; letter-spacing: 0; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>
  <div id="time">00:00</div>
<script>
  function tick() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, "0");
    var m = String(d.getMinutes()).padStart(2, "0");
    document.getElementById("time").textContent = h + ":" + m;
  }
  function fit() {
    var el = document.getElementById("time");
    el.style.fontSize = "100px";
    var w = el.getBoundingClientRect().width;
    var h = el.getBoundingClientRect().height;
    var k = Math.min(window.innerWidth * 0.94 / w, window.innerHeight * 0.9 / h);
    el.style.fontSize = (100 * k) + "px";
  }
  tick();
  fit();
  setInterval(tick, 1000);
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

</script>
</body>
</html>
